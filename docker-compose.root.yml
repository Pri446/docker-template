networks:
  laravel:

services:
  php:
    build:
      context: ./dockerfiles
      dockerfile: php.root.dockerfile
    container_name: php-imis
    volumes:
      - ./src/imis-revamp2.0:/var/www/html/imis:delegated
    networks:
      - laravel

  queue-worker:
    build:
      context: ./dockerfiles
      dockerfile: php.root.dockerfile
    container_name: queue-worker-imis
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./src/imis-revamp2.0:/var/www/html/imis:delegated
    working_dir: /var/www/html/imis
    restart: always
    depends_on:
      - php
    networks:
      - laravel

  composer:
    image: composer:2
    container_name: composer-imis
    volumes:
      - ./src/imis-revamp2.0:/var/www/html/imis
    working_dir: /var/www/html/imis
    depends_on:
      - php
    user: root
    entrypoint: ['composer']
    networks:
      - laravel

  npm:
    image: node:13.7
    container_name: npm-imis
    volumes:
      - ./src/imis-revamp2.0:/var/www/html/imis
    ports:
      - 3000:3000
      - 3001:3001
    working_dir: /var/www/html/imis
    entrypoint: ['npm']
    networks:
      - laravel

  artisan:
    build:
      context: ./dockerfiles
      dockerfile: php.root.dockerfile
    container_name: artisan-imis
    volumes:
      - ./src/imis-revamp2.0:/var/www/html/imis:delegated
    working_dir: /var/www/html/imis
    entrypoint: ['php', '/var/www/html/imis/artisan']
    networks:
      - laravel
