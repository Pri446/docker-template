server {
    listen 80;
    server_name localhost;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    client_max_body_size 64M;
    
    index index.html index.htm index.php;

    charset utf-8;

    location / {
       try_files $uri $uri/ /index.php?$query_string;
	}

    error_page 404 /index.php;

    location /imis {
        alias /var/www/html/imis/public;
        try_files $uri $uri/ @imis-base;

        location = /imis/favicon.ico { access_log off; log_not_found off; }
        location = /imis/robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
       }
    }

    location @imis-base {
        rewrite /imis/(.*)$ /imis/index.php?/$1 last;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
